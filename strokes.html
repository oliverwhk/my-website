<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stroke by Stroke 🖌️</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3/dist/hanzi-writer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', 'Arial Rounded MT Bold', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
      padding: 16px;
      color: #333;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    .back { color: white; font-weight: 700; text-decoration: none; font-size: 14px; }
    h1 { text-align: center; color: white; font-size: 28px; font-weight: 800; text-shadow: 1px 2px 4px rgba(0,0,0,.2); margin: 6px 0; }
    .subtitle { text-align: center; color: rgba(255,255,255,.9); font-size: 14px; margin-bottom: 16px; }

    .card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.1); }

    textarea {
      width: 100%; font-size: 22px; font-family: inherit; padding: 10px 12px;
      border: 2px solid #fad0c4; border-radius: 12px; resize: vertical; min-height: 70px;
    }
    textarea:focus { outline: none; border-color: #ff6b81; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button {
      font-family: inherit; font-size: 15px; font-weight: 700; border: none; border-radius: 12px;
      padding: 10px 16px; cursor: pointer; background: #ff6b81; color: white;
    }
    button.secondary { background: #ffe3e8; color: #d6455d; }
    button:disabled { opacity: .5; cursor: default; }

    .chars { display: flex; flex-wrap: wrap; gap: 8px; }
    .chars button {
      width: 52px; height: 52px; padding: 0; font-size: 28px; background: #fff5f6; color: #333;
      border: 2px solid #fad0c4; font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .chars button.active { background: #ff6b81; color: white; border-color: #ff6b81; }
    .chars .punct { align-self: center; font-size: 24px; color: #aaa; width: 20px; text-align: center; }

    .main { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; justify-content: center; }
    #target {
      width: 240px; height: 240px; border: 2px solid #fad0c4; border-radius: 12px; background: #fffdfd;
      background-image:
        linear-gradient(to right, transparent calc(50% - 1px), #fad0c4 50%, transparent calc(50% + 1px)),
        linear-gradient(to bottom, transparent calc(50% - 1px), #fad0c4 50%, transparent calc(50% + 1px));
    }
    #target svg { display: block; }
    .info { flex: 1; min-width: 180px; }
    .info .big { font-size: 20px; font-weight: 800; }
    .info .meta { color: #777; font-size: 14px; margin: 4px 0 10px; min-height: 20px; }
    .msg { margin-top: 10px; font-weight: 700; color: #d6455d; min-height: 22px; }

    h2 { font-size: 16px; margin-bottom: 10px; }
    .steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
    .step { text-align: center; }
    .step svg { width: 100%; height: auto; border: 1px solid #fad0c4; border-radius: 8px; background: #fffdfd; display: block; }
    .step span { font-size: 12px; color: #888; font-weight: 700; }
    .hint { color: #888; font-size: 13px; text-align: center; padding: 20px 0; }
  </style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Back to Chinese Writer</a>
  <h1>Stroke by Stroke 🖌️</h1>
  <p class="subtitle">Type a Chinese sentence, then learn each character one stroke at a time</p>

  <div class="card">
    <textarea id="sentence" placeholder="输入中文句子，例如：我爱学中文">我爱学中文</textarea>
    <div class="row">
      <button id="go">Break it down</button>
    </div>
  </div>

  <div class="card" id="charsCard" hidden>
    <div class="chars" id="chars"></div>
  </div>

  <div class="card" id="viewer" hidden>
    <div class="main">
      <div id="target"></div>
      <div class="info">
        <div class="big" id="charTitle"></div>
        <div class="meta" id="charMeta"></div>
        <div class="row" style="margin-top:0">
          <button id="animate">▶ Animate</button>
          <button id="quiz" class="secondary">✏️ Practice</button>
          <button id="prev" class="secondary">◀ Prev</button>
          <button id="next" class="secondary">Next ▶</button>
        </div>
        <div class="msg" id="msg"></div>
      </div>
    </div>
  </div>

  <div class="card" id="stepsCard" hidden>
    <h2>Stroke order</h2>
    <div class="steps" id="steps"></div>
  </div>
</div>

<script>
  const CJK = /[㐀-䶿一-鿿]/;
  const DATA_URL = c => `https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/${encodeURIComponent(c)}.json`;
  const $ = id => document.getElementById(id);

  let list = [];      // unique hanzi in the sentence
  let index = 0;
  let writer = null;
  let token = 0;      // guards against out-of-order async loads

  function makeSvg(strokes, upTo, color) {
    // Hanzi Writer data lives in a 1024 box with an inverted y-axis.
    const paths = strokes.slice(0, upTo + 1).map((d, i) =>
      `<path d="${d}" fill="${i === upTo ? '#ff6b81' : color}"/>`).join('');
    return `<svg viewBox="0 0 1024 1024"><g transform="translate(0,900) scale(1,-1)">${paths}</g></svg>`;
  }

  function parse() {
    const text = $('sentence').value;
    list = [...new Set([...text].filter(c => CJK.test(c)))];
    index = 0;
    const box = $('chars');
    box.innerHTML = '';
    // Show the sentence in order, with non-Chinese characters as plain spacers.
    [...text].forEach(c => {
      if (CJK.test(c)) {
        const b = document.createElement('button');
        b.textContent = c;
        b.dataset.c = c;
        b.onclick = () => select(list.indexOf(c));
        box.appendChild(b);
      } else if (c.trim()) {
        const s = document.createElement('div');
        s.className = 'punct';
        s.textContent = c;
        box.appendChild(s);
      }
    });
    const has = list.length > 0;
    $('charsCard').hidden = !has;
    $('viewer').hidden = !has;
    $('stepsCard').hidden = !has;
    if (has) select(0);
  }

  async function select(i) {
    if (i < 0 || i >= list.length) return;
    index = i;
    const char = list[i];
    const my = ++token;
    document.querySelectorAll('#chars button').forEach(b => b.classList.toggle('active', b.dataset.c === char));
    $('charTitle').textContent = char;
    $('charMeta').textContent = 'Loading…';
    $('msg').textContent = '';
    $('steps').innerHTML = '';
    $('prev').disabled = i === 0;
    $('next').disabled = i === list.length - 1;
    $('target').innerHTML = '';
    writer = null;

    let data;
    try {
      const res = await fetch(DATA_URL(char));
      if (!res.ok) throw new Error(res.status);
      data = await res.json();
    } catch (e) {
      if (my !== token) return;
      $('charMeta').textContent = 'No stroke data available for this character.';
      $('steps').innerHTML = '<div class="hint">Stroke data could not be loaded.</div>';
      return;
    }
    if (my !== token) return;

    $('charMeta').textContent = `${data.strokes.length} stroke${data.strokes.length === 1 ? '' : 's'}`;
    $('steps').innerHTML = data.strokes.map((_, n) =>
      `<div class="step">${makeSvg(data.strokes, n, '#333')}<span>${n + 1}</span></div>`).join('');

    writer = HanziWriter.create('target', char, {
      width: 240, height: 240, padding: 12,
      showOutline: true, strokeColor: '#333', outlineColor: '#f3cdd3',
      strokeAnimationSpeed: 1, delayBetweenStrokes: 250,
      charDataLoader: (_, done) => done(data)
    });
    writer.animateCharacter();
  }

  $('go').onclick = parse;
  $('sentence').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) parse(); });
  $('prev').onclick = () => select(index - 1);
  $('next').onclick = () => select(index + 1);
  $('animate').onclick = () => {
    if (!writer) return;
    $('msg').textContent = '';
    writer.cancelQuiz();
    writer.animateCharacter();
  };
  $('quiz').onclick = () => {
    if (!writer) return;
    $('msg').textContent = 'Draw each stroke in order ✍️';
    writer.quiz({
      onCorrectStroke: d => { $('msg').textContent = `Stroke ${d.strokeNum + 1} ✓`; },
      onMistake: () => { $('msg').textContent = 'Not quite — try again'; },
      onComplete: () => { $('msg').textContent = '🎉 Well done!'; }
    });
  };

  if (typeof HanziWriter === 'undefined') {
    $('msg').textContent = 'Could not load the Hanzi Writer library. Check your connection.';
  }
  parse();
</script>
</body>
</html>
